services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opentrafficdb
      POSTGRES_USER: opentraffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentraffic -d opentrafficdb"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dev: