services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opentrafficdb
      POSTGRES_USER: opentraffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - /mnt/opentraffic/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentraffic -d opentrafficdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    volumes:
      - /mnt/opentraffic/valhalla:/custom_files
    environment:
      tile_building_blocked: "0"
      tile_urls: https://download.geofabrik.de/europe/germany-latest.osm.pbf
    ports:
      - "0.0.0.0:8096:8002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  overpass:
    image: wiktorn/overpass-api
    restart: unless-stopped
    environment:
      OVERPASS_META: "no"
      OVERPASS_MODE: clone
      OVERPASS_DIFF_URL: https://planet.openstreetmap.org/replication/minute/
    volumes:
      - /mnt/opentraffic/overpass:/db
    ports:
      - "0.0.0.0:8097:80"

  api:
    image: ${APP_IMAGE:-opentrafficdb:latest}
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:8095:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=opentrafficdb;
        Username=opentraffic;Password=${POSTGRES_PASSWORD:-changeme}
      Valhalla__BaseUrl: http://localhost:8096
      Overpass__BaseUrl: https://overpass-api.de
    depends_on:
      postgres:
        condition: service_healthy
      valhalla:
        condition: service_started
