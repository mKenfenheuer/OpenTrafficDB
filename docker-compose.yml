services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    shm_size: 1024mb
    command: >
      postgres
      -c shared_buffers=6GB
      -c effective_cache_size=4GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_worker_processes=12
      -c max_parallel_workers=12
      -c max_parallel_workers_per_gather=4
      -c max_parallel_maintenance_workers=4
      -c jit=on
      -c jit_above_cost=50000
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=64MB
      -c synchronous_commit=off
      -c wal_compression=zstd
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=200
      -c autovacuum_vacuum_scale_factor=0.01
      -c autovacuum_analyze_scale_factor=0.005
      -c autovacuum_vacuum_cost_delay=2ms
    environment:
      POSTGRES_DB: opentrafficdb
      POSTGRES_USER: opentraffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/opentraffic/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentraffic -d opentrafficdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: opentraffic
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: opentrafficdb
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    volumes:
      - /mnt/opentraffic/valhalla:/custom_files
    ports:
      - 0.0.0.0:8096:8002
    environment:
      tile_building_blocked: "0"
      tile_urls: ${VALHALLA_TILE_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  valhalla-dev:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    volumes:
      - /mnt/opentraffic/valhalla_dev:/custom_files
    ports:
      - 0.0.0.0:8097:8002
    environment:
      tile_building_blocked: "0"
      tile_urls: ${VALHALLA_TILE_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /mnt/opentraffic/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  ingest:
    image: ${INGEST_IMAGE:-registry.gitlab.com/opentrafficdb/ingest:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      Jwt__Key: ${JWT_KEY}
      Security__IpHashPepper: ${IP_HASH_PEPPER}
    depends_on:
      pgbouncer:
        condition: service_started

  aggregate:
    image: ${AGGREGATE_IMAGE:-registry.gitlab.com/opentrafficdb/aggregate:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__ReadConnection: "Host=${READ_DB_HOST:-pgbouncer};Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Security__IpHashPepper: ${IP_HASH_PEPPER}
      Valhalla__BaseUrl: http://valhalla:8002
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started

  aggregate-2:
    image: ${AGGREGATE_IMAGE:-registry.gitlab.com/opentrafficdb/aggregate:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__ReadConnection: "Host=${READ_DB_HOST:-pgbouncer};Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Security__IpHashPepper: ${IP_HASH_PEPPER}
      Valhalla__BaseUrl: http://valhalla:8002
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started

  aggregate-3:
    image: ${AGGREGATE_IMAGE:-registry.gitlab.com/opentrafficdb/aggregate:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__ReadConnection: "Host=${READ_DB_HOST:-pgbouncer};Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Security__IpHashPepper: ${IP_HASH_PEPPER}
      Valhalla__BaseUrl: http://valhalla:8002
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started

  osm-importer:
    image: ${OSM_IMPORTER_IMAGE:-registry.gitlab.com/opentrafficdb/osm-importer:latest}
    restart: unless-stopped
    volumes:
      - /mnt/opentraffic/osm:/data
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=5;No Reset On Close=true"
      Osm__PbfPath: /data/map.osm.pbf
      Osm__PbfUrl: ${VALHALLA_TILE_URL}
    depends_on:
      pgbouncer:
        condition: service_started

  routing:
    image: ${ROUTING_IMAGE:-registry.gitlab.com/opentrafficdb/routing:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__ReadConnection: "Host=${READ_DB_HOST:-pgbouncer};Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      Jwt__Key: ${JWT_KEY}
      Security__IpHashPepper: ${IP_HASH_PEPPER}
      Valhalla__BaseUrl: http://valhalla:8002
    depends_on:
      pgbouncer:
        condition: service_started
      valhalla:
        condition: service_started

  routing-2:
    image: ${ROUTING_IMAGE:-registry.gitlab.com/opentrafficdb/routing:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      ConnectionStrings__ReadConnection: "Host=${READ_DB_HOST:-pgbouncer};Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      Jwt__Key: ${JWT_KEY}
      Security__IpHashPepper: ${IP_HASH_PEPPER}
      Valhalla__BaseUrl: http://valhalla:8002
    depends_on:
      pgbouncer:
        condition: service_started
      valhalla:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/opentraffic/prometheus:/prometheus
    depends_on:
      - api
      - ingest
      - aggregate

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /mnt/opentraffic/grafana:/var/lib/grafana
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://opentraffic:${POSTGRES_PASSWORD}@postgres:5432/opentrafficdb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:alpine
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  api:
    image: ${APP_IMAGE:-registry.gitlab.com/opentrafficdb/app:latest}
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-8095}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=opentrafficdb;Username=opentraffic;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;No Reset On Close=true"
      Jwt__Key: ${JWT_KEY}
      Coordinator__ChunkSize: 5000
      Security__IpHashPepper: ${IP_HASH_PEPPER}
      BaseUrl: ${BASE_URL}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-25}
      Email__SmtpUser: ${SMTP_USER:-}
      Email__SmtpPassword: ${SMTP_PASSWORD:-}
      Email__EnableSsl: ${SMTP_SSL:-false}
      Email__FromAddress: ${SMTP_FROM:-opentrafficdb@localhost}
      Email__FromName: ${SMTP_FROM_NAME:-OpenTrafficDB}
      Workers__Ingest__Urls__0: http://ingest:8080
      Workers__Aggregate__Urls__0: http://aggregate:8080
      Workers__Aggregate__Urls__1: http://aggregate-2:8080
      Workers__Aggregate__Urls__2: http://aggregate-3:8080
      Workers__Routing__Urls__0: http://routing:8080
      Workers__Routing__Urls__1: http://routing-2:8080
    depends_on:
      pgbouncer:
        condition: service_started
      ingest:
        condition: service_started
      aggregate:
        condition: service_started
      aggregate-3:
        condition: service_started
      routing:
        condition: service_started
