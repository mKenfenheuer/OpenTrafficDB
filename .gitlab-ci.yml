before_script:
  - export CI_ENVIRONMENT_HOST=$(echo $CI_ENVIRONMENT_URL | sed 's~http[s]*://~~g')

stages:
  - build
  - deploy

# ── Docker image build ──────────────────────────────────────────────────────
build_amd64_image:
  stage: build
  only:
    - main
  tags:
    - docker
    - build
    - linux
    - shell
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t opentrafficdb .
    - docker image tag opentrafficdb $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker image tag opentrafficdb $CI_REGISTRY_IMAGE:latest
    - docker image push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE:latest
    - docker image prune -f

# ── Production deployment ───────────────────────────────────────────────────
deploy_production:
  stage: deploy
  needs:
    - build_amd64_image
  allow_failure: false
  only:
    - main
  environment:
    name: prod
  tags:
    - docker
    - linux
    - no-gpu
  script:
    - mkdir -p /mnt/data/opentraffic/valhalla
    - mkdir -p /mnt/data/opentraffic/postgres
    - |
      if [ ! -f /mnt/data/opentraffic/valhalla/map.osm.pbf ]; then
        echo "Downloading Germany OSM PBF..."
        wget -q --show-progress \
          -O /mnt/data/opentraffic/valhalla/map.osm.pbf \
          https://download.geofabrik.de/europe/germany-latest.osm.pbf
      else
        echo "map.osm.pbf already present, skipping download."
      fi
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export APP_IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker compose pull api
    - docker compose up -d
