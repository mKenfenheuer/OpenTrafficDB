    - docker image tag routing-image $CI_REGISTRY_IMAGE/routing:$CI_COMMIT_SHORT_SHA
    - docker image tag routing-image $CI_REGISTRY_IMAGE/routing:$BRANCH_TAG
    - docker image push $CI_REGISTRY_IMAGE/routing:$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE/routing:$BRANCH_TAG
    - if [ "$IS_MAIN" = "true" ]; then docker image tag routing-image $CI_REGISTRY_IMAGE/routing:latest && docker image push $CI_REGISTRY_IMAGE/routing:latest; fi
    - docker image prune -f

# ── Production deployment ─────────────────────────────────────────────────────
deploy_production:
  stage: deploy
  needs:
    - job: build_tools
      optional: true
    - job: build_app
      optional: true
    - job: build_ingest
      optional: true
    - job: build_aggregate
      optional: true
    - job: build_routing
      optional: true
    - job: build_osm_importer
      optional: true
  allow_failure: false
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      changes:
        - App/**/*
        - IngestWorker/**/*
        - AggregateWorker/**/*
        - RoutingWorker/**/*
        - OsmWayImporter/**/*
        - Shared/**/*
        - tools/traffic-tar-builder/**/*
        - tools/predicted-traffic-patcher/**/*
        - docker-compose.yml
        - .gitlab-ci.yml
        - .env.example
  environment:
    name: prod
  tags: [docker, linux, no-gpu]
  script:
    - mkdir -p /mnt/opentraffic/valhalla /mnt/opentraffic/postgres /mnt/opentraffic/osm /mnt/opentraffic/redis
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export APP_IMAGE=$CI_REGISTRY_IMAGE/app:latest
    - export INGEST_IMAGE=$CI_REGISTRY_IMAGE/ingest:latest
    - export AGGREGATE_IMAGE=$CI_REGISTRY_IMAGE/aggregate:latest
    - export ROUTING_IMAGE=$CI_REGISTRY_IMAGE/routing:latest
    - export OSM_IMPORTER_IMAGE=$CI_REGISTRY_IMAGE/osm-importer:latest
    - docker compose pull --ignore-pull-failures
    - docker compose up -d
