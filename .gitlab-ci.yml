before_script:
  - export BRANCH_TAG=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
  - export IS_MAIN=$([[ "$CI_COMMIT_REF_NAME" == "main" ]] && echo "true" || echo "false")

stages:
  - tools
  - build
  - deploy

# ── Traffic tar builder tool ─────────────────────────────────────────────────
build_tools:
  stage: tools
  image: debian:bookworm-slim
  tags: [docker, build, dind]
  rules:
    - changes:
        - tools/traffic-tar-builder/**/*
        - tools/predicted-traffic-patcher/**/*
        - App/**/*
  before_script: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends g++ make
    - mkdir -p downloads
    # Build traffic_tar_builder
    - cd tools/traffic-tar-builder
    - make CXX=g++ CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -static"
    - cp traffic_tar_builder ../../downloads/traffic_tar_builder-linux-amd64
    - tar -czf ../../downloads/traffic_tar_builder-src.tar.gz traffic_tar_builder.cpp Makefile
    - cd ../..
    # Build predicted_traffic_patcher
    - cd tools/predicted-traffic-patcher
    - make CXX=g++ CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -static"
    - cp predicted_traffic_patcher ../../downloads/predicted_traffic_patcher-linux-amd64
    - tar -czf ../../downloads/predicted_traffic_patcher-src.tar.gz predicted_traffic_patcher.cpp Makefile
  artifacts:
    paths:
      - downloads/
    expire_in: 1 week

# ── App ──────────────────────────────────────────────────────────────────────
build_app:
  stage: build
  tags: [docker, build, linux, shell]
  needs:
    - job: build_tools
      optional: true
      artifacts: true
  rules:
    - changes:
        - App/**/*
        - tools/traffic-tar-builder/**/*
        - tools/predicted-traffic-patcher/**/*
  script:
    - mkdir -p App/wwwroot/downloads
    - if [ -d downloads ]; then cp downloads/* App/wwwroot/downloads/; fi
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f App/Dockerfile -t app-image .
    - docker image tag app-image $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA
    - docker image tag app-image $CI_REGISTRY_IMAGE/app:$BRANCH_TAG
    - docker image push $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE/app:$BRANCH_TAG
    - if [ "$IS_MAIN" = "true" ]; then docker image tag app-image $CI_REGISTRY_IMAGE/app:latest && docker image push $CI_REGISTRY_IMAGE/app:latest; fi
    - docker image prune -f

# ── Production deployment ─────────────────────────────────────────────────────
deploy_production:
  stage: deploy
  needs:
    - job: build_tools
      optional: true
    - job: build_app
      optional: true
  allow_failure: false
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      changes:
        - App/**/*
        - tools/traffic-tar-builder/**/*
        - tools/predicted-traffic-patcher/**/*
        - docker-compose.yml
        - .gitlab-ci.yml
        - .env.example
  environment:
    name: prod
  tags: [docker, linux, no-gpu]
  script:
    - mkdir -p /mnt/opentraffic/postgres /mnt/opentraffic/osm /mnt/opentraffic/redis
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export APP_IMAGE=$CI_REGISTRY_IMAGE/app:latest
    - docker compose pull --ignore-pull-failures
    - docker compose up -d --remove-orphans
