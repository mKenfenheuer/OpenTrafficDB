    - docker image tag ingest-image $CI_REGISTRY_IMAGE/ingest:$BRANCH_TAG
    - docker image push $CI_REGISTRY_IMAGE/ingest:$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE/ingest:$BRANCH_TAG
    - if [ "$IS_MAIN" = "true" ]; then docker image tag ingest-image $CI_REGISTRY_IMAGE/ingest:latest && docker image push $CI_REGISTRY_IMAGE/ingest:latest; fi
    - docker image prune -f

