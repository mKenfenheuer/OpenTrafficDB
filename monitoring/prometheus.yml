global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otdb-api'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: api

  - job_name: 'otdb-ingest'
    static_configs:
      - targets: ['ingest:8080']
        labels:
          service: ingest

  - job_name: 'otdb-aggregate'
    static_configs:
      - targets: ['aggregate:8080', 'aggregate-2:8080', 'aggregate-3:8080']
        labels:
          service: aggregate

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis
